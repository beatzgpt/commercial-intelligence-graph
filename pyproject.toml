[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-intelligence-graph"
version = "0.1.0"
description = "Illustrative account-research pipeline: synthetic signals -> SQLite -> graph -> explainable score -> brief"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "matplotlib>=3.7", "jinja2>=3.1", "pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
cig = "cig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cig = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
